<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store image</title>
<!--
  Builds the store images from popup captures (raw/*.png, 760x600 popups captured at 2x):
    ?shot=<name>    1280x800 screenshot
    ?tile=small     440x280 small promo tile
    ?tile=marquee   1400x560 marquee promo tile
  Screenshot the viewport at that size, then save it as a 24-bit PNG. See CONTRIBUTING.md.
-->
<style>
    @font-face {
        font-family: "F37 Bolton";
        font-weight: 100 900;
        src: url("../../packages/assets/fonts/F37Bolton-VF.ttf") format("truetype");
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        overflow: hidden;
    }

    body {
        background:
            radial-gradient(circle at 0% 0%, rgb(14 168 0 / 14%), transparent 44%),
            radial-gradient(circle at 100% 100%, rgb(14 168 0 / 10%), transparent 42%),
            #f6f3ec;
        color: #131212;
        font-family: "F37 Bolton", Helvetica, Arial, sans-serif;
        position: relative;
    }

    h1 {
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
    }

    h1 em {
        color: #0ea800;
        font-style: normal;
    }

    p {
        color: #3c475b;
        margin: 0;
    }

    .brand-icon {
        border-radius: 22%;
        box-shadow: 0 8px 20px rgb(6 80 0 / 25%);
        display: block;
    }

    .popup {
        background: #fdfcfb;
        border: 1px solid #e1e1df;
        border-radius: 20px;
        box-shadow: 0 30px 80px rgb(19 18 18 / 18%), 0 6px 18px rgb(19 18 18 / 8%);
        overflow: hidden;
        position: absolute;
    }

    .popup img {
        display: block;
        width: 100%;
    }

    /* A floating callout naming one feature. */
    .callout {
        align-items: center;
        background: #fff;
        border-radius: 999px;
        box-shadow: 0 14px 34px rgb(19 18 18 / 16%), 0 2px 6px rgb(19 18 18 / 8%);
        color: #131212;
        display: inline-flex;
        font-size: 19px;
        font-weight: 600;
        gap: 10px;
        padding: 12px 22px 12px 12px;
        position: absolute;
        white-space: nowrap;
        z-index: 2;
    }

    .callout span {
        align-items: center;
        background: #ebf6e6;
        border-radius: 50%;
        color: #087f00;
        display: inline-flex;
        height: 36px;
        justify-content: center;
        width: 36px;
    }

    .callout span svg {
        height: 20px;
        width: 20px;
    }

    .callout.gold span {
        background: #fff1c2;
        color: #8a5a00;
    }

    /* 1280x800 screenshot: headline across the top, the popup running off the bottom. */
    body.screenshot {
        height: 800px;
        padding: 50px 140px 0;
        width: 1280px;
    }

    .screenshot .top {
        align-items: flex-end;
        display: flex;
        gap: 40px;
        justify-content: space-between;
    }

    .screenshot h1 {
        font-size: 48px;
        line-height: 54px;
    }

    .screenshot .top p {
        font-size: 21px;
        line-height: 30px;
        margin-top: 10px;
        max-width: 690px;
    }

    .screenshot .brand-icon {
        height: 64px;
        width: 64px;
    }

    .screenshot .popup {
        border-bottom: 0;
        border-radius: 20px 20px 0 0;
        left: 140px;
        top: 214px;
        width: 1000px;
    }

    /* The promo tiles: Domain green, the pitch in white, popups rising on the right. */
    body.tile {
        background:
            radial-gradient(circle at 85% 15%, rgb(255 255 255 / 18%), transparent 38%),
            radial-gradient(circle at 10% 110%, rgb(255 255 255 / 12%), transparent 40%),
            linear-gradient(135deg, #12b000, #078000 70%, #056800);
        color: #fff;
    }

    .tile p {
        color: rgb(255 255 255 / 86%);
    }

    .tile .brand {
        align-items: center;
        display: flex;
        gap: 14px;
    }

    .tile .brand-icon {
        border: 3px solid rgb(255 255 255 / 92%);
        box-shadow: 0 10px 24px rgb(0 40 0 / 30%);
    }

    .tile .name {
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .chips span {
        background: rgb(255 255 255 / 16%);
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: 999px;
        color: #fff;
        font-weight: 600;
        white-space: nowrap;
    }

    .tile .popup {
        border: 0;
        box-shadow: 0 30px 70px rgb(0 30 0 / 40%), 0 6px 16px rgb(0 30 0 / 20%);
    }

    /* 1400x560 marquee. */
    body.marquee {
        height: 560px;
        padding: 74px 0 0 88px;
        width: 1400px;
    }

    .marquee .pitch {
        position: relative;
        width: 560px;
        z-index: 3;
    }

    .marquee .brand-icon {
        height: 60px;
        width: 60px;
    }

    .marquee .name {
        font-size: 28px;
    }

    .marquee h1 {
        font-size: 58px;
        line-height: 62px;
        margin-top: 30px;
    }

    .marquee .pitch p {
        font-size: 22px;
        line-height: 31px;
        margin-top: 14px;
    }

    .marquee .chips {
        margin-top: 26px;
    }

    .marquee .chips span {
        font-size: 16px;
        padding: 7px 14px;
    }

    .marquee .back {
        left: 700px;
        top: 40px;
        transform: rotate(-4deg);
        width: 560px;
    }

    .marquee .front {
        left: 840px;
        top: 150px;
        transform: rotate(3deg);
        width: 600px;
    }

    .marquee .callout {
        font-size: 17px;
    }

    /* 440x280 small tile. */
    body.small {
        height: 280px;
        padding: 30px 0 0 28px;
        width: 440px;
    }

    .small .pitch {
        position: relative;
        width: 236px;
        z-index: 2;
    }

    .small .brand-icon {
        height: 52px;
        width: 52px;
    }

    .small .name {
        font-size: 26px;
        line-height: 28px;
        margin-top: 16px;
    }

    .small .pitch p {
        font-size: 15px;
        line-height: 20px;
        margin-top: 8px;
    }

    .small .chips {
        gap: 6px;
        margin-top: 14px;
    }

    .small .chips span {
        font-size: 12px;
        padding: 4px 9px;
    }

    .small .popup {
        border-radius: 12px;
        left: 280px;
        top: 38px;
        transform: rotate(4deg);
        width: 300px;
    }
</style>
</head>
<body>
<script>
    // Headline (with an <em> accent), line, and callouts: [icon, text, left, top, gold?]. The
    // icons are the extension's own (packages/assets/icons), inlined below.
    const SHOTS = {
        "saved-searches": {
            title: "Saved searches, <em>without the emails</em>",
            text: "Keep a search saved with no email alerts, see its filters at a glance, and share it with your extra filters.",
            callouts: [["share", "Share with your extra filters", 925, 545], ["bell", "Never, daily or weekly emails", 60, 700]],
        },
        filters: {
            title: "Filters <em>Domain doesn't have</em>",
            text: "Pick your could-haves, exclude keywords, cap strata fees and hide property types. Changes apply straight away.",
            callouts: [["could-haves", "Tick extras, or add your own", 920, 470, true], ["strata", "Strata caps and keyword filters", 60, 735]],
        },
        blacklist: {
            title: "Hide it once, and <em>it stays hidden</em>",
            text: "Blacklist listings, agencies and agents across every search, and bring any of them back in a click.",
            callouts: [["trash", "Hide whole agencies and agents", 60, 520], ["restore", "Unblacklist any in a click", 940, 640]],
        },
        "sign-in": {
            title: "Your setup, <em>on every browser</em>",
            text: "Sign in to sync your filters, blacklist and saved searches wherever you search.",
            callouts: [["sync", "Synced across your browsers", 920, 330], ["person", "Google, Apple, Facebook or email", 860, 610]],
        },
    };
    const params = new URLSearchParams(location.search);
    const tile = params.get("tile");
    const icon = '<img class="brand-icon" src="../../packages/assets/icons/brand/icon.png" alt="">';
    const popup = (name, className = "") => `<div class="popup ${className}"><img src="raw/${name}.png" alt=""></div>`;
    const ICON_PATHS = {
        bell: "search/bell", "could-haves": "filters/could-haves", hide: "actions/hide", person: "account/person",
        restore: "actions/restore", search: "search/search", share: "actions/share", strata: "filters/strata", sync: "account/sync", trash: "actions/trash",
    };
    const callout = ([icon, text, left, top, gold]) =>
        `<div class="callout${gold ? " gold" : ""}" style="left:${left}px;top:${top}px"><span data-icon="${icon}"></span>${text}</div>`;

    if (tile === "small") {
        document.body.className = "tile small";
        document.body.innerHTML = `
            <div class="pitch">
                ${icon}
                <div class="name">Extra Domain Filters</div>
                <p>The filters Domain doesn't have</p>
                <div class="chips"><span>Could-haves</span><span>Blacklist</span><span>Strata</span></div>
            </div>
            ${popup("filters")}`;
    } else if (tile === "marquee") {
        document.body.className = "tile marquee";
        document.body.innerHTML = `
            <div class="pitch">
                <div class="brand">${icon}<span class="name">Extra Domain Filters</span></div>
                <h1>The filters Domain doesn't have</h1>
                <p>Shape every domain.com.au search around what matters to you.</p>
                <div class="chips"><span>Could-haves</span><span>Keyword filters</span><span>Strata cap</span><span>Blacklist</span></div>
            </div>
            ${popup("saved-searches", "back")}
            ${popup("filters", "front")}
            ${callout(["could-haves", "Pool matched", 760, 420, true])}
            ${callout(["hide", "3 listings hidden", 1140, 470])}`;
    } else {
        const shot = SHOTS[params.get("shot") ?? "filters"];
        document.body.className = "screenshot";
        document.body.innerHTML = `
            <div class="top">
                <div><h1>${shot.title}</h1><p></p></div>
                ${icon}
            </div>
            ${popup(params.get("shot") ?? "filters")}
            ${shot.callouts.map(callout).join("")}`;
        document.querySelector(".top p").textContent = shot.text;
    }
    // Inline each icon so it takes the callout's colour; body[data-ready] says the image is done.
    Promise.all([...document.querySelectorAll("[data-icon]")].map(async slot => {
        const svg = await (await fetch(`../../packages/assets/icons/${ICON_PATHS[slot.dataset.icon]}.svg`)).text();
        slot.innerHTML = svg.replace(/<\?xml[^>]*>|<!--[\s\S]*?-->/g, "").replace(/\s(?:width|height)="[^"]*"/g, "");
    })).then(() => { document.body.dataset.ready = "true"; });
</script>
</body>
</html>
