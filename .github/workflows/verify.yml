name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm stylelint

      - run: pnpm build

      - name: Verify extension build artifacts
        run: |
          test -f apps/extension/.output/chrome-mv3/background.js
          test -f apps/extension/.output/chrome-mv3/popup.html
          test -f apps/extension/.output/chrome-mv3/manifest.json
